# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# The scraper runs from local cron (setup_cron.sh), not from Actions; live Wongnai collection
# is not approved.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scraper:
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (requires-python, ruff.toml targets py310) and a current release.
        python-version: ["3.10", "3.13"]
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: ${{ matrix.python-version }}
      # Installs from uv.lock (uv sync --frozen --all-extras); ruff and mypy come from the dev extra.
      # Ratchet: measured 91.11% on 2026-10-22 on 3.10 and 3.13 (ADR-0004: threshold = measured,
      # rounded down); raise it as tests grow.
      coverage-threshold: "91"
      # Offline pytest under coverage (fixtures only, no live site traffic), then the dry-run plan.
      test-command: |
        python -m pytest -q --cov
        python scripts/run_restaurants.py --dry-run --json > /dev/null

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
